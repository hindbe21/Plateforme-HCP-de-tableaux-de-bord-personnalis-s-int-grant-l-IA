{% extends "base.html" %}

{% block title %}Supprimer le widget | Plateforme HCP{% endblock %}

{% block content %}

<div class="hcp-page d-flex align-items-center justify-content-center">

    <section class="hcp-form-shell text-center">

        <span class="hcp-profile-big-avatar mb-3" style="color: var(--hcp-danger); background: var(--hcp-danger-soft);">
            <i class="bi bi-trash"></i>
        </span>

        <h1 class="page-title fs-2">
            Supprimer le widget
        </h1>

        <p class="text-muted mt-3">
            Confirmez la suppression du widget
            <strong>{{ widget.titre }}</strong>.
        </p>

        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                <button type="submit" class="btn btn-danger px-4">
                    Supprimer
                </button>
                <a
                    href="{% url 'dashboards:detail' tableau_bord.pk %}"
                    class="btn btn-outline-secondary px-4"
                >
                    Annuler
                </a>
            </div>
        </form>

    </section>

</div>

{% endblock %}
